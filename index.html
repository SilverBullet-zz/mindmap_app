<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#eefbf3" />
    <title>枝图 - 思维导图</title>
    <link rel="stylesheet" href="./styles.css?v=36" />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div class="brand" aria-label="枝图">
          <span class="brand-mark" aria-hidden="true">
            <i></i><i></i><i></i>
          </span>
          <span>枝图</span>
        </div>
        <div class="document-title">
          <input id="document-title" value="主题" aria-label="文档名称" />
          <span class="save-state">已保存</span>
        </div>
        <div class="search-box" id="search-box">
          <div class="search-input-wrap">
            <span class="search-icon" aria-hidden="true"></span>
            <input id="search-input" type="search" placeholder="搜索主题" autocomplete="off" aria-label="搜索思维导图主题" />
          </div>
          <button class="search-toggle" id="search-case-toggle" type="button" aria-pressed="false" title="区分大小写">Aa</button>
          <button class="search-toggle" id="search-scope-toggle" type="button" aria-pressed="false" title="搜索范围">本页</button>
          <div class="search-results" id="search-results" hidden></div>
        </div>
        <div class="top-actions">
          <button class="secondary-button" id="home-button" type="button" title="工作目录首页" aria-label="工作目录首页">
            首页
          </button>
          <button class="secondary-button" id="compare-button" type="button" title="对比两个工作目录中的思维导图" aria-label="对比思维导图">
            对比
          </button>
          <button class="secondary-button open-local-button" id="open-local-button" type="button" title="打开本地 .mindmap.json 文件" aria-label="打开本地文件">
            打开本地文件
          </button>
          <button class="command-button file-button" id="save-button" type="button" title="保存工程 (Ctrl+S)" aria-label="保存工程">
            <span class="save-icon" aria-hidden="true"></span>
            <span>保存</span>
          </button>
          <input id="open-file-input" type="file" accept=".json,.mindmap.json,application/json" hidden />
          <span class="toolbar-divider"></span>
          <button class="icon-button" id="undo-button" type="button" title="撤销 (Ctrl+Z)" aria-label="撤销" disabled>
            <span aria-hidden="true">↶</span>
          </button>
          <button class="icon-button" id="redo-button" type="button" title="重做 (Ctrl+Shift+Z)" aria-label="重做" disabled>
            <span aria-hidden="true">↷</span>
          </button>
          <span class="toolbar-divider"></span>
          <div class="export-control">
            <button class="primary-button" id="export-button" type="button" aria-haspopup="menu" aria-expanded="false">
              <span class="export-icon" aria-hidden="true">↓</span>
              导出
              <span class="menu-chevron" aria-hidden="true"></span>
            </button>
            <div class="export-menu" id="export-menu" role="menu" hidden>
              <button type="button" role="menuitem" data-export-format="mindmap">
                <span class="format-badge mindmap">MAP</span>
                <span><strong>Mindmap 工程</strong><small>可继续编辑的 .mindmap.json</small></span>
              </button>
              <button type="button" role="menuitem" data-export-format="png">
                <span class="format-badge png">PNG</span>
                <span><strong>PNG 图片</strong><small>高清透明兼容图片</small></span>
              </button>
              <button type="button" role="menuitem" data-export-format="pdf">
                <span class="format-badge pdf">PDF</span>
                <span><strong>PDF 文档</strong><small>适合打印与分享</small></span>
              </button>
            </div>
          </div>
        </div>
      </header>

      <div class="workspace">
        <aside class="tool-rail" aria-label="思维导图工具">
          <button class="tool-button active" type="button" title="选择" aria-label="选择">
            <span class="cursor-icon" aria-hidden="true"></span>
          </button>
          <button class="tool-button" id="add-button" type="button" title="添加子主题 (Tab)" aria-label="添加子主题">
            <span class="plus-icon" aria-hidden="true"></span>
          </button>
          <button class="tool-button" id="edit-button" type="button" title="编辑主题 (F2)" aria-label="编辑主题">
            <span class="edit-icon" aria-hidden="true"></span>
          </button>
          <span class="rail-divider"></span>
          <button class="tool-button" id="copy-button" type="button" title="复制主题与子主题 (Ctrl+C)" aria-label="复制主题与子主题">
            <span class="copy-icon" aria-hidden="true"></span>
          </button>
          <button class="tool-button" id="paste-button" type="button" title="粘贴到选中主题下 (Ctrl+V)" aria-label="粘贴到选中主题下" disabled>
            <span class="paste-icon" aria-hidden="true"></span>
          </button>
          <span class="rail-divider"></span>
          <button class="tool-button danger" id="delete-button" type="button" title="删除主题 (Delete)" aria-label="删除主题">
            <span class="trash-icon" aria-hidden="true"></span>
          </button>
        </aside>

        <aside class="workspace-sidebar" id="workspace-sidebar" aria-label="工作目录">
          <button class="workspace-collapse" id="workspace-collapse" type="button" title="收起工作目录" aria-label="收起工作目录"></button>
          <div class="workspace-sidebar-content">
            <div class="workspace-sidebar-header">
              <span class="workspace-kicker">Working Folder</span>
              <strong>工作目录</strong>
            </div>
            <div class="workspace-folder-card">
              <span class="folder-icon workspace-folder-icon" aria-hidden="true"></span>
              <div>
                <span id="workspace-folder-name">未选择文件夹</span>
                <small id="workspace-folder-status">保存和打开会先使用这里</small>
              </div>
            </div>
            <div class="workspace-sidebar-actions">
              <button class="secondary-button" id="choose-workspace-folder" type="button">选择文件夹</button>
              <button class="secondary-button" id="open-workspace-file" type="button">打开文件</button>
            </div>
            <div class="workspace-file-section">
              <div class="workspace-file-header">
                <span>文件</span>
                <button class="text-button" id="refresh-workspace-files" type="button">刷新</button>
              </div>
              <div class="workspace-file-list" id="workspace-file-list"></div>
            </div>
          </div>
          <div class="workspace-resizer" id="workspace-resizer" role="separator" aria-orientation="vertical" aria-label="调整工作目录栏宽度"></div>
        </aside>

        <main class="canvas-viewport" id="canvas-viewport" tabindex="0" aria-label="思维导图画布">
          <div class="canvas-grid"></div>
          <div class="selection-marquee" id="selection-marquee" hidden></div>
          <div class="mindmap-stage" id="mindmap-stage">
            <svg class="connections" id="connections" aria-hidden="true"></svg>
            <div id="nodes-layer"></div>
          </div>

          <div class="canvas-hint" id="canvas-hint">
            <span class="hint-dot"></span>
            <span id="hint-text">双击主题进行编辑</span>
          </div>

          <div class="zoom-controls" aria-label="缩放工具">
            <button id="zoom-out" type="button" title="缩小" aria-label="缩小">−</button>
            <span id="zoom-label">100%</span>
            <button id="zoom-in" type="button" title="放大" aria-label="放大">+</button>
            <span class="zoom-divider"></span>
            <button id="fit-button" type="button" title="适应画布" aria-label="适应画布">
              <span class="fit-icon" aria-hidden="true"></span>
            </button>
          </div>

          <button class="map-return-button" id="map-return-button" type="button" hidden>
            返回链接前位置
          </button>
        </main>
      </div>

      <section class="home-overlay" id="home-overlay" hidden aria-label="工作目录首页">
        <div class="home-panel">
          <div class="home-header">
            <div>
              <h1>工作目录</h1>
              <p>这里显示当前 Working Folder 中的思维导图文件，自动保存也写入同一个文件夹。</p>
            </div>
            <div class="home-actions">
              <button class="secondary-button" id="new-local-map" type="button">新建</button>
              <button class="secondary-button" id="trash-button" type="button" aria-pressed="false">垃圾桶</button>
              <button class="icon-button" id="close-home" type="button" title="关闭首页" aria-label="关闭首页">×</button>
            </div>
          </div>
          <div class="home-list" id="home-list"></div>
        </div>
      </section>

      <section class="compare-overlay" id="compare-overlay" hidden aria-label="思维导图对比">
        <div class="compare-panel" role="dialog" aria-modal="true" aria-labelledby="compare-title">
          <header class="compare-header">
            <div>
              <span class="compare-kicker">Compare</span>
              <h1 id="compare-title">对比思维导图</h1>
              <p>选择 Working Folder 中的两个 map，查看新增、删除和修改的主题。</p>
            </div>
            <button class="icon-button" id="close-compare" type="button" title="关闭对比" aria-label="关闭对比">×</button>
          </header>
          <div class="compare-controls">
            <label>
              <span>左侧 map</span>
              <select id="compare-left"></select>
            </label>
            <label>
              <span>右侧 map</span>
              <select id="compare-right"></select>
            </label>
            <button class="primary-button" id="run-compare" type="button">开始对比</button>
          </div>
          <div class="compare-result" id="compare-result"></div>
        </div>
      </section>

      <section class="document-overlay" id="node-document-overlay" hidden aria-label="主题文档页面">
        <div class="document-panel">
          <header class="document-panel-header">
            <div>
              <span class="document-kicker">Markdown</span>
              <h1 id="node-document-title">主题文档</h1>
            </div>
            <div class="document-actions">
              <button class="secondary-button" id="copy-document-button" type="button">复制</button>
              <button class="secondary-button" id="insert-image-button" type="button">插入图片</button>
              <button class="icon-button" id="close-document-button" type="button" title="关闭文档" aria-label="关闭文档">×</button>
            </div>
          </header>
          <div class="document-workspace">
            <textarea id="node-document-editor" spellcheck="false" aria-label="Markdown 编辑器"></textarea>
            <article class="markdown-preview" id="node-document-preview" aria-label="Markdown 预览"></article>
          </div>
          <input id="document-image-input" type="file" accept="image/*" hidden />
        </div>
      </section>
      <input id="node-image-input" type="file" accept="image/*" hidden />

      <section class="image-viewer-overlay" id="document-image-viewer" hidden aria-label="图片预览">
        <button class="image-viewer-close" id="close-image-viewer" type="button" aria-label="关闭图片预览">×</button>
        <img id="document-image-viewer-img" alt="" />
      </section>

      <section class="conflict-overlay" id="workspace-conflict-overlay" hidden aria-label="文件冲突">
        <div class="conflict-dialog" role="dialog" aria-modal="true" aria-labelledby="workspace-conflict-title">
          <span class="conflict-kicker">保存冲突</span>
          <h2 id="workspace-conflict-title">这个文件已经在别处被修改</h2>
          <p id="workspace-conflict-message"></p>
          <div class="conflict-actions">
            <button class="primary-button" id="conflict-save-copy" type="button">另存为副本</button>
            <button class="secondary-button" id="conflict-overwrite" type="button">覆盖保存</button>
            <button class="secondary-button" id="conflict-reload" type="button">载入外部版本</button>
            <button class="text-button" id="conflict-dismiss" type="button">暂不处理</button>
          </div>
        </div>
      </section>
    </div>

    <script src="./app.js?v=53"></script>
  </body>
</html>
